<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocker Spaniel Club of Southern California</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            line-height: 1.6;
            color: #333;
        }

        /* Hero Section with Black and White Cocker Spaniel Background */
        .hero {
            height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                        url('https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?ixlib=rb-1.2.1&auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 0 20px;
        }

        /* Navigation */
        nav {
            background: rgba(255, 255, 255, 0.95);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-container img {
            height: 50px;
            width: auto;
        }

        .logo-text {
            font-weight: 700;
            font-size: 1.5rem;
            color: #2c3e50;
            letter-spacing: 1px;
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin-left: 25px;
        }

        nav ul li a {
            text-decoration: none;
            color: #333;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        nav ul li a:hover {
            color: #d35400; /* Subtle accent color */
        }

        /* Main Content */
        .hero-content h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .hero-content p {
            font-size: 1.2rem;
            max-width: 700px;
            margin: 0 auto 2rem;
        }

        .btn {
            display: inline-block;
            background: #d35400;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 600;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #e67e22;
        }

        /* Mobile Menu */
        @media (max-width: 768px) {
            nav {
                flex-direction: column;
            }
            nav ul {
                margin-top: 15px;
            }
            nav ul li {
                margin: 0 10px;
            }
            .hero-content h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo-container">
            <img src="logo.jpg" alt="CSCSC Logo">
            <span class="logo-text">CSCSC</span>
        </div>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About the Breed</a></li>
            <li><a href="#events">Upcoming Events</a></li>
            <li><a href="#health">Health Clinics</a></li>
            <li><a href="#contact">Contact Us</a></li>
        </ul>
    </nav>

    <header class="hero" id="home">
        <div class="hero-content">
            <h1>Cocker Spaniel Club of Southern California</h1>
            <p>Dedicated to the preservation, health, and welfare of the Cocker Spaniel in the Southern California region.</p>
            <a href="#about" class="btn">Learn More About the Breed</a>
        </div>
    </header>

</body>
</html>
